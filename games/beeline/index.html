<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) report real
      values, which packages/core's safe-area helper depends on. Without it,
      HUD elements land under the notch on iPhones.
      user-scalable=no stops a double-tap in a fast game from zooming the page.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12100c" />
    <!--
      Browsers request /favicon.ico unprompted, and a 404 for it shows up as a
      console error during portal QA. An inline data URI costs ~130 bytes and
      removes the request entirely — cheaper than shipping an .ico file.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f2b134'/%3E%3C/svg%3E"
    />
    <title>Beeline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101018;
        /* Kills the grey tap-highlight flash on mobile Safari and Chrome. */
        -webkit-tap-highlight-color: transparent;
        /* Stops pull-to-refresh and rubber-banding from fighting the game. */
        overscroll-behavior: none;
        touch-action: none;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #game canvas {
        display: block;
      }

      /*
        Shown before Phaser boots. A blank screen during load reads as a broken
        game to a portal reviewer — this guarantees something is on screen from
        the very first paint, before any JavaScript has run.
      */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a8aa0;
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /*
        Portrait prompt.

        Lives in the DOM rather than in Phaser on purpose: at 16:9 in portrait
        the canvas is only a strip across the middle third of the screen, so
        anything drawn inside the game would sit inside that same strip and
        leave the empty area unexplained. Only a DOM overlay can cover it.
      */
      #rotate-gate {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #12100c;
        color: #ffd966;
        text-align: center;
        z-index: 10;
      }

      #rotate-gate.visible {
        display: flex;
      }

      .rotate-icon {
        width: 96px;
        height: 96px;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }

      .rotate-title {
        margin: 20px 0 6px;
        font-size: 22px;
        font-weight: 600;
        color: #f4f4f8;
      }

      .rotate-sub {
        margin: 0;
        font-size: 15px;
        color: #8a8aa0;
      }

      @keyframes rotate-hint {
        0%,
        30% {
          transform: rotate(0deg);
        }
        55%,
        85% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      /* Respect users who have asked for less motion. */
      @media (prefers-reduced-motion: reduce) {
        .rotate-icon {
          animation: none;
          transform: rotate(-90deg);
        }
      }

      #boot.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
